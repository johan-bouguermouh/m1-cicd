name: Delivery — build & publish image

# Builds once, on the branch that matters for a release, and pushes the
# artifact to GHCR — this is Continuous *Delivery*, not Deployment: nobody
# decides here to expose anything to users, just that a specific commit is
# packaged and ready to be promoted later (by a Deployment pipeline,
# triggered by a tag — see docs/pipeline-architecture.md once written).
#
# workflow_dispatch lets this be tested manually (any branch) without
# needing a real push to main yet.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push already in flight to the registry — an aborted
  # push can leave a half-written image manifest behind.
  cancel-in-progress: false

permissions:
  contents: read
  # Required to push to GHCR with the default GITHUB_TOKEN — no external
  # registry account/secret needed, same "zero extra account" reasoning
  # as audit-ci/gitleaks earlier in this pipeline.
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Also load the built image into this runner's local Docker
          # daemon, so the smoke test below runs the exact image just
          # pushed instead of pulling it back from the registry.
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          # Reuse layer cache across runs (GitHub Actions cache backend) —
          # same idea as the yarn/Cypress cache in ci.yml (§4.4), applied
          # to Docker layers instead of node_modules.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building without errors doesn't mean the app actually runs — boot
      # the just-built image for real and hit it over HTTP before calling
      # this Delivery. Checks two things: the container comes up at all,
      # and the SPA fallback added alongside the Dockerfile (§ backend/
      # app.ts) actually serves index.html for a client-side route instead
      # of 404ing.
      - name: Smoke test the image
        run: |
          set -e
          docker run -d --name smoke -p 3001:3001 "ghcr.io/${{ github.repository }}:${{ github.sha }}"

          echo "Waiting for the app to respond..."
          up=false
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/; then
              echo "App is up after ${i} attempt(s)"
              up=true
              break
            fi
            sleep 2
          done
          if [ "$up" != "true" ]; then
            echo "::error::App never responded on port 3001"
            docker logs smoke
            exit 1
          fi

          index_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/)
          echo "GET / -> ${index_status}"

          spa_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/signin)
          echo "GET /signin -> ${spa_status}"
          if [ "$spa_status" != "200" ]; then
            echo "::error::Expected 200 from the SPA fallback on /signin, got ${spa_status}"
            docker logs smoke
            exit 1
          fi

          docker logs smoke

      - name: Stop smoke test container
        if: always()
        run: docker rm -f smoke || true
